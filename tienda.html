<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda</title><link rel="stylesheet" href="/app.css"><script src="/config.js"></script></head><body>
<div id="ann"></div><div class="hd"><b id="lg" style="font-size:18px"></b><input id="s" type="search" placeholder="Buscar productos"><button onclick="cartUI()">🛒 <span id="cn">0</span></button></div>
<div id="hero"></div><div class="w"><div id="cats"></div><div id="app" class="g"></div><div class="c"><button id="more" class="b2" style="display:none" onclick="load()">Ver más</button></div></div><footer class="w" id="ft"></footer><div id="md"></div>
<script>
const C=CFG,H={apikey:C.KEY,Authorization:"Bearer "+C.KEY},$=s=>document.querySelector(s),
e=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),
$$=n=>"$"+Number(n).toLocaleString("es-AR"),
q=p=>fetch(C.URL+"/rest/v1/"+p,{headers:H}).then(r=>r.json()),
slug=location.pathname.split("/")[2]||new URLSearchParams(location.search).get("t"),N=12;
let S,T={},cs=[],M={},cat="",term="",off=0,cart=[];
const g=(a,b)=>(T[a]||{})[b]||"",u=x=>/^https?:\/\//.test(x)?x:"",sv=()=>{localStorage.setItem("c_"+slug,JSON.stringify(cart));$("#cn").textContent=cart.reduce((a,i)=>a+i.qty,0)};
(async()=>{
const s=await q("stores?slug=eq."+encodeURIComponent(slug)+"&select=id,name");
if(!Array.isArray(s)||!s[0]){$("#app").outerHTML="<p class=c>Tienda no disponible</p>";return}
S=s[0];try{cart=JSON.parse(localStorage.getItem("c_"+slug)||"[]")}catch(x){}
const[st,c2]=await Promise.all([q("store_settings?store_id=eq."+S.id),q("categories?store_id=eq."+S.id+"&order=position")]);
T=st[0]||{};cs=c2;document.title=S.name;sv();
const col=g("design","color");if(/^#[0-9a-f]{6}$/i.test(col))document.documentElement.style.setProperty("--c",col);
$("#ann").textContent=g("design","announce");
$("#lg").innerHTML=u(g("design","logo"))?`<img src="${e(g("design","logo"))}" height=36 alt="${e(S.name)}">`:e(S.name);
const bn=u(g("design","banner"));
$("#hero").innerHTML=(bn?`<img src="${e(bn)}" style="width:100%;max-height:340px;object-fit:cover" alt="">`:"")+(g("design","title")?`<div class=c><h2>${e(g("design","title"))}</h2><p>${e(g("design","subtitle"))}</p></div>`:"");
$("#cats").innerHTML=`<span class="ch on" onclick="sc('',this)">Todo</span>`+cs.map(x=>`<span class=ch onclick="sc('${x.id}',this)">${e(x.name)}</span>`).join("");
let tm;$("#s").oninput=function(){clearTimeout(tm);tm=setTimeout(()=>{term=this.value.trim();load(1)},350)};
const L=(k,l)=>u(g("contact",k))?`<a href="${e(g("contact",k))}" target=_blank rel=noopener>${l}</a> `:"";
const P=(l,v)=>v?`<p><b>${l}</b> ${e(v)}</p>`:"",D=(l,v)=>v?`<details><summary>${l}</summary><p style="white-space:pre-line">${e(v)}</p></details>`:"";
$("#ft").innerHTML=L("instagram","Instagram")+L("tiktok","TikTok")+L("facebook","Facebook")+P("Tel:",g("contact","phone"))+P("Email:",g("contact","email"))+P("Dirección:",g("contact","address"))+P("Pagos:",g("payments","installments"))+D("Sobre nosotros",g("info","about"))+D("Preguntas frecuentes",g("info","faq"))+D("Cambios y devoluciones",g("info","returns"));
load(1);
})();
function sc(id,el){cat=id;document.querySelectorAll(".ch").forEach(c=>c.classList.remove("on"));el.classList.add("on");load(1)}
async function load(r){if(r){off=0;$("#app").innerHTML=""}
let p=`products?store_id=eq.${S.id}&select=*&order=featured.desc,position,created_at.desc&limit=${N}&offset=${off}`;
if(cat)p+="&category_id=eq."+cat;if(term)p+="&name=ilike.*"+encodeURIComponent(term.replace(/[*,()]/g,""))+"*";
const d=await q(p);d.forEach(x=>M[x.id]=x);
$("#app").insertAdjacentHTML("beforeend",d.map(card).join(""));
if(r&&!d.length)$("#app").innerHTML="<p class=c style='grid-column:1/-1'>Sin productos</p>";
off+=N;$("#more").style.display=d.length==N?"":"none"}
const card=x=>{const d=x.compare_price>x.price?Math.round(100-x.price*100/x.compare_price):0;return `<div class=k onclick="openP('${x.id}')"><img loading=lazy width=300 height=300 src="${e(x.images[0]||"")}" alt="${e(x.name)}"><div>${e(x.name)}</div><b>${$$(x.price)}</b> ${d?`<span class=o>${$$(x.compare_price)}</span> <span class=off>${d}% OFF</span>`:""}${x.stock===0?"<div class=o>Sin stock</div>":""}</div>`};
function openP(id){const x=M[id],o=a=>a.map(s=>`<option>${e(s)}</option>`).join("");
$("#md").innerHTML=`<div class=m onclick="if(event.target==this)this.remove()"><div><img id=bi src="${e(x.images[0]||"")}" style="width:100%;border-radius:8px" alt="">${x.images.map(i=>`<img class=th loading=lazy src="${e(i)}" onclick="bi.src=this.src" alt="">`).join("")}<h3>${e(x.name)}</h3><b>${$$(x.price)}</b>${x.compare_price>x.price?` <span class=o>${$$(x.compare_price)}</span>`:""}<p style="white-space:pre-line">${e(x.description)}</p>${x.sizes.length?`<select id=sz>${o(x.sizes)}</select>`:""}${x.colors.length?`<select id=co>${o(x.colors)}</select>`:""}<button ${x.stock===0?"disabled":""} onclick="add('${x.id}')">${x.stock===0?"Sin stock":"Agregar al carrito"}</button></div></div>`}
function add(id){const x=M[id],z=$("#sz")?.value||"",c=$("#co")?.value||"",f=cart.find(i=>i.id==id&&i.size==z&&i.color==c);
if(f){if(x.stock!=null&&f.qty>=x.stock)return alert("No hay más stock");f.qty++}else cart.push({id,name:x.name,price:x.price,size:z,color:c,qty:1});sv();cartUI()}
function chg(n,d){const i=cart[n],s=M[i.id]?.stock;i.qty+=d;if(s!=null&&i.qty>s)i.qty=s;if(i.qty<=0)cart.splice(n,1);sv();cartUI()}
function tot(){const sub=cart.reduce((a,i)=>a+i.price*i.qty,0),fr=+g("shipping","free_from"),sh=fr&&sub>=fr?0:+g("shipping","cost")||0,td=+g("payments","transfer_discount")||0;return{sub,sh,td,tr:Math.round(sub*(100-td)/100+sh)}}
function cartUI(){const t=tot(),wa=g("contact","whatsapp").replace(/\D/g,""),mp=u(g("payments","mp_link")),al=g("payments","alias"),fr=+g("shipping","free_from");
$("#md").innerHTML=`<div class=m onclick="if(event.target==this)this.remove()"><div><h3>Tu carrito</h3>${cart.length?cart.map((i,n)=>`<p>${e(i.name)} ${e([i.size,i.color].filter(Boolean).join(" / "))}<br><button class=b2 onclick="chg(${n},-1)">−</button> ${i.qty} <button class=b2 onclick="chg(${n},1)">+</button> ${$$(i.price*i.qty)}</p>`).join("")+`<hr>Subtotal: ${$$(t.sub)}<br>Envío: ${t.sh?$$(t.sh):"Gratis"}${fr&&t.sub<fr?` <small>(gratis desde ${$$(fr)})</small>`:""}<br><b>Total: ${$$(t.sub+t.sh)}</b>${t.td?`<br>Pagando por transferencia (${t.td}% off): <b>${$$(t.tr)}</b>`:""}${al?`<p>Alias: <b>${e(al)}</b></p>`:""}<div class=t>${wa?`<button onclick="wapp()">Pedir por WhatsApp</button>`:""}${mp?`<a class=b href="${e(mp)}" target=_blank rel=noopener>Pagar con link de pago</a>`:""}</div>`:"<p>Está vacío</p>"}</div></div>`}
function wapp(){const t=tot(),m=`Hola! Quiero hacer este pedido en ${S.name}:\n`+cart.map(i=>`• ${i.qty}x ${i.name}${i.size||i.color?" ("+[i.size,i.color].filter(Boolean).join(", ")+")":""} - ${$$(i.price*i.qty)}`).join("\n")+`\nEnvío: ${t.sh?$$(t.sh):"Gratis"}\nTotal: ${$$(t.sub+t.sh)}`;open("https://wa.me/"+g("contact","whatsapp").replace(/\D/g,"")+"?text="+encodeURIComponent(m))}
</script></body></html>
