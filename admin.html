<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de tienda</title><link rel="stylesheet" href="/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/config.js"></script></head><body><div class="w" id="r">Cargando…</div>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=s=>document.querySelector(s),R=h=>$("#r").innerHTML=h,
e=s=>String(s??"").replace(/[&<>"']/g,c=>"&#"+c.charCodeAt(0)+";"),list=s=>s.split(",").map(x=>x.trim()).filter(Boolean);
let S,T={},P=[],K=[],ed=null,tab="p",imgs=[],master=false;
const F=[["design","color","Color principal","color"],["design","logo","Logo (subí una imagen)","img"],["design","banner","Banner de portada (imagen)","img"],["design","announce","Texto de barra superior (ej: 20% off por transferencia)"],["design","title","Título de portada"],["design","subtitle","Subtítulo de portada"],
["contact","whatsapp","WhatsApp con código de país (ej 5491122334455)"],["contact","instagram","Instagram (link completo https://...)"],["contact","tiktok","TikTok (link completo)"],["contact","facebook","Facebook (link completo)"],["contact","phone","Teléfono"],["contact","email","Correo"],["contact","address","Dirección del negocio"],
["payments","mp_link","Link de pago (Mercado Pago u otro, https://...)"],["payments","alias","Alias / datos bancarios"],["payments","transfer_discount","% descuento por transferencia","number"],["payments","installments","Cuotas y medios de pago (texto)"],
["shipping","cost","Costo de envío","number"],["shipping","free_from","Envío gratis desde (importe)","number"],
["info","about","Información del negocio","area"],["info","faq","Preguntas frecuentes (texto libre)","area"],["info","returns","Política de cambios y devoluciones","area"]];
function login(m){R(`<div style="max-width:340px;margin:40px auto"><h2>Ingresar</h2><input id=em type=email placeholder=Email><input id=pw type=password placeholder=Contraseña><button onclick="go()">Entrar</button><p>${m||""}</p></div>`)}
async function go(){const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});error?login("Datos incorrectos"):boot()}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
const{data:pf}=await sb.from("profiles").select("role").eq("id",session.user.id).maybeSingle();master=pf?.role=="master";
const id=new URLSearchParams(location.search).get("store");let qy=sb.from("stores").select("*,plans(name,max_products)");
qy=master?(id?qy.eq("id",id):null):qy.eq("owner_id",session.user.id);
if(!qy)return location.href="/master.html";
const{data}=await qy.order("created_at");S=data?.[0];if(!S)return R("<p>No tenés una tienda asignada. Contactá al administrador.</p><button onclick=out()>Salir</button>");
await load()}
async function load(){const[a,b,c]=await Promise.all([sb.from("store_settings").select("*").eq("store_id",S.id).maybeSingle(),sb.from("categories").select("*").eq("store_id",S.id).order("position"),sb.from("products").select("*").eq("store_id",S.id).order("created_at",{ascending:false})]);T=a.data||{};K=b.data||[];P=c.data||[];draw()}
const out=async()=>{await sb.auth.signOut();location.href=location.pathname};
function draw(){const exp=S.expires_at&&S.expires_at<new Date().toISOString().slice(0,10),tb=(k,l)=>`<button class="${tab==k?"":"b2"}" onclick="tab='${k}';ed=null;draw()">${l}</button>`;
R(`<div class=t><b style="flex:1;font-size:18px">${e(S.name)}</b>${master?`<a class="b b2" href="/master.html">← Maestro</a>`:""}<a class="b b2" target=_blank href="/tienda.html?t=${e(S.slug)}">Ver tienda</a><button class=b2 onclick=out()>Salir</button></div>${S.status!="active"||exp?`<div class=warn>${master?"Tienda suspendida o vencida (vos podés editarla igual).":"Tu tienda está suspendida o vencida. Contactá al administrador."}</div>`:""}<div class=t>${tb("p","Productos")}${tb("c","Categorías")}${tb("s","Configuración")}</div><div id=v></div>`);
tab=="p"?(ed?formP():listP()):tab=="c"?cats():sets()}
function listP(){$("#v").innerHTML=`<p>Plan ${e(S.plans?.name||"-")}: ${P.length}/${S.plans?.max_products??"∞"} productos</p><button onclick="newP()">+ Nuevo producto</button><div class=sc><table><tr><th>Producto<th>Precio<th>Stock<th>Estado<th></tr>${P.map(p=>`<tr><td>${e(p.name)}${p.featured?" ⭐":""}<td>$${p.price}<td>${p.stock??"∞"}<td>${p.active?"Visible":"Oculto"}<td><button class=b2 onclick="editP('${p.id}')">Editar</button> <button class=r onclick="delP('${p.id}')">X</button></tr>`).join("")}</table></div>`}
function newP(){ed={};imgs=[];draw()}
function editP(id){ed=P.find(p=>p.id==id);imgs=[...ed.images];draw()}
async function delP(id){if(!confirm("¿Eliminar producto?"))return;const{error}=await sb.from("products").delete().eq("id",id);error?alert(error.message):load()}
function formP(){const p=ed,v=(k,d="")=>e(p[k]??d);
$("#v").innerHTML=`<h3>${p.id?"Editar":"Nuevo"} producto</h3>Nombre<input id=n value="${v("name")}">Descripción<textarea id=d rows=3>${v("description")}</textarea>Precio<input id=pr type=number value="${v("price")}">Precio anterior (opcional, se muestra tachado)<input id=cp type=number value="${v("compare_price")}">Categoría<select id=ct><option value="">Sin categoría</option>${K.map(k=>`<option value=${k.id} ${p.category_id==k.id?"selected":""}>${e(k.name)}</option>`).join("")}</select>Talles (separados por coma)<input id=sz value="${e((p.sizes||[]).join(", "))}">Colores (separados por coma)<input id=co value="${e((p.colors||[]).join(", "))}">Stock (vacío = sin control)<input id=st type=number value="${v("stock")}"><label><input type=checkbox id=ft ${p.featured?"checked":""}> Destacado</label> <label><input type=checkbox id=ac ${p.active??true?"checked":""}> Visible</label><p>Fotos</p><div id=pv></div><input type=file accept="image/*" multiple onchange="addI(this)"><div class=t><button onclick="saveP()">Guardar</button><button class=b2 onclick="ed=null;draw()">Cancelar</button></div>`;pv()}
const pv=()=>$("#pv").innerHTML=imgs.map((i,n)=>`<img class=th src="${e(i)}" onclick="imgs.splice(${n},1);pv()" title="Tocar para quitar">`).join("");
async function webp(f,max=1000){const b=await createImageBitmap(f),r=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*r|0;c.height=b.height*r|0;c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(o=>c.toBlob(o,"image/webp",.8))}
async function up(f){const b=await webp(f),p=`${S.id}/${crypto.randomUUID()}.${b.type=="image/webp"?"webp":"png"}`,{error}=await sb.storage.from("store-images").upload(p,b,{contentType:b.type,cacheControl:"31536000"});if(error){alert(error.message);return}return sb.storage.from("store-images").getPublicUrl(p).data.publicUrl}
async function addI(i){for(const f of i.files){const u=await up(f);if(u)imgs.push(u)}pv()}
async function saveP(){const v=id=>$("#"+id).value,o={store_id:S.id,name:v("n").trim(),description:v("d"),price:+v("pr"),compare_price:v("cp")?+v("cp"):null,category_id:v("ct")||null,sizes:list(v("sz")),colors:list(v("co")),stock:v("st")===""?null:+v("st"),featured:$("#ft").checked,active:$("#ac").checked,images:imgs};
if(!o.name||!v("pr"))return alert("Completá nombre y precio");
const{error}=ed.id?await sb.from("products").update(o).eq("id",ed.id):await sb.from("products").insert(o);if(error)return alert(error.message);ed=null;load()}
function cats(){$("#v").innerHTML=`<input id=kn placeholder="Nueva categoría"><button onclick="addK()">Agregar</button><table>${K.map(k=>`<tr><td>${e(k.name)}<td><button class=r onclick="delK('${k.id}')">X</button></tr>`).join("")}</table>`}
async function addK(){const n=$("#kn").value.trim();if(!n)return;const s=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");const{error}=await sb.from("categories").insert({store_id:S.id,name:n,slug:s||"cat",position:K.length});error?alert(error.message):load()}
async function delK(id){if(!confirm("¿Eliminar categoría? Los productos quedan sin categoría."))return;await sb.from("categories").delete().eq("id",id);load()}
function sets(){$("#v").innerHTML=F.map(([a,b,l,t])=>{const val=e((T[a]||{})[b]??"");return `<label>${l}${t=="area"?`<textarea data-a=${a} data-b=${b} rows=3>${val}</textarea>`:`<input data-a=${a} data-b=${b} type=${t=="img"?"text":t||"text"} value="${val}">`}</label>${t=="img"?`<input type=file accept="image/*" onchange="fillI(this)">`:""}`}).join("")+`<button onclick="saveS()">Guardar configuración</button>`}
async function fillI(i){const u=await up(i.files[0]);if(u)i.previousElementSibling.querySelector("input").value=u}
async function saveS(){const o={design:{...T.design},contact:{...T.contact},payments:{...T.payments},shipping:{...T.shipping},info:{...T.info}};
document.querySelectorAll("[data-a]").forEach(i=>o[i.dataset.a][i.dataset.b]=i.type=="number"&&i.value!==""?+i.value:i.value);
const{error}=await sb.from("store_settings").update({...o,updated_at:new Date().toISOString()}).eq("store_id",S.id);error?alert(error.message):(alert("Guardado"),load())}
boot();
</script></body></html>
